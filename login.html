<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SoleStyle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      background: url('pexels-atiss260-1782110107-33597709.jpg') center / cover no-repeat;
      padding: 20px;
    }

    .login-form {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      padding: 48px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      margin-right: 60px;
    }

    .login-form h1 {
      color: #000000;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .login-form p.sub {
      color: #000000;
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #000000;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: #000000;
      border: none;
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #FFFFFF;
    }

    .form-group input::placeholder {
      color: #999;
    }

    .form-group input:-webkit-autofill,
    .form-group input:-webkit-autofill:hover,
    .form-group input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #000000 inset;
      -webkit-text-fill-color: #FFFFFF;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .form-options label {
      color: #000000;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .form-options label input {
      accent-color: #E31E24;
      width: 16px;
      height: 16px;
    }

    .form-options a {
      color: #000000;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .form-options a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: #000000;
      border: none;
      border-radius: 10px;
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-login:hover {
      background: #E31E24;
      transform: translateY(-1px);
    }

    .login-form .signup-link {
      text-align: center;
      margin-top: 24px;
      color: #000000;
      font-size: 0.9rem;
    }

    .login-form .signup-link a {
      color: #000000;
      text-decoration: none;
      font-weight: 600;
    }

    .login-form .signup-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        justify-content: center;
        padding: 16px;
      }

      .login-form {
        margin-right: 0;
        padding: 32px 24px;
      }

      .login-form h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-form">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your SoleStyle account</p>

    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox" checked> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <p class="signup-link">
      Don't have an account? <a href="signup.html">Sign up</a>
    </p>
  </div>

</body>
</html>
