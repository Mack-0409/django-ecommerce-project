<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="forgot.css">
</head>
<body>

  <div class="forgot-wrapper">
    <!-- Visual Panel -->
    <div class="forgot-visual">
      <div class="forgot-brand">NO<span>IR</span></div>
      <p class="forgot-tagline">Forged in midnight. Built to dominate.</p>
      <img class="forgot-visual-img"
           src="https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?w=400&q=80"
           alt="Premium footwear">
    </div>

    <!-- Form Panel -->
    <div class="forgot-panel">
      <div class="forgot-form-container">
        <div class="logo">NO<span>IR</span></div>
        <h1 class="form-heading">Reset Password</h1>
        <p class="form-sub">Enter your username and new password.</p>

        <form class="forgot-form" id="forgotForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="johndoe" required>
          </div>

          <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="8">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-primary">Reset Password</button>
        </form>

        <p class="form-footer">
          Remember your password? <a href="signin.html">Sign In</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const pw = document.getElementById('password');
      const cpw = document.getElementById('confirmPassword');
      if (pw.value !== cpw.value) {
        cpw.classList.add('input-error');
        return;
      }
      cpw.classList.remove('input-error');
    });
  </script>

</body>
</html>
