<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin.css">
</head>
<body>

  <div class="signin-wrapper">
    <!-- Visual Panel -->
    <div class="signin-visual">
      <div class="signin-brand">NO<span>IR</span></div>
      <p class="signin-tagline">Forged in midnight. Built to dominate.</p>
      <img class="signin-visual-img"
           src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&q=80"
           alt="Premium footwear">
    </div>

    <!-- Form Panel -->
    <div class="signin-panel">
      <div class="signin-form-container">
        <div class="logo">NO<span>IR</span></div>
        <h1 class="form-heading">Welcome Back</h1>
        <p class="form-sub">Sign in to your account to continue.</p>

        <form class="signin-form" id="signinForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="johndoe" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <div class="form-options">
            <label class="remember-row">
              <input type="checkbox" checked>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p class="form-footer">
          Don't have an account? <a href="signup.html">Create one</a>
        </p>
      </div>
    </div>
  </div>

</body>
</html>
