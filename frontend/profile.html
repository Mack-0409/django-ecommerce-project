<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — NOIR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="index.html" class="logo">NO<span>IR</span></a>
      <nav class="nav" id="nav">
        <a href="index.html">Home</a>
        <a href="index.html#featured">New Drops</a>
        <a href="signup.html">Sign Up</a>
        <a href="signin.html">Sign In</a>
        <a href="#profile">Profile</a>
        <a href="index.html#logout">Logout</a>
      </nav>
      <div class="header-actions">
        <div class="uiverse-pixel-input-wrapper">
          <input
            placeholder="Search..."
            class="uiverse-pixel-input"
            type="text"
          />
        </div>
        <button class="icon-btn" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span class="cart-count">3</span>
        </button>
        <button class="icon-btn" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button class="icon-btn" aria-label="Logout">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
        <div class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== PROFILE PAGE ===== -->
  <section class="profile-page">

    <div class="profile-head">
      <div class="profile-avatar">JD</div>
      <div class="profile-head-info">
        <h1>John Doe</h1>
        <p class="profile-email">john.doe@example.com</p>
        <p class="profile-join">Member since January 2026</p>
      </div>
    </div>

    <div class="profile-grid">
      <div class="profile-card">
        <div class="profile-card-label">First Name</div>
        <div class="profile-card-value">John</div>
      </div>
      <div class="profile-card">
        <div class="profile-card-label">Last Name</div>
        <div class="profile-card-value">Doe</div>
      </div>
      <div class="profile-card">
        <div class="profile-card-label">Username</div>
        <div class="profile-card-value">johndoe</div>
      </div>
      <div class="profile-card">
        <div class="profile-card-label">Email</div>
        <div class="profile-card-value">john.doe@example.com</div>
      </div>
    </div>



    <div style="text-align:center;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)">
      <button class="logout-btn">Logout</button>
    </div>
  </section>

  <script>
    document.getElementById('hamburger').addEventListener('click', function () {
      this.classList.toggle('active');
      const nav = document.querySelector('.nav');
      if (nav.style.display === 'flex') {
        nav.style.display = '';
      } else {
        nav.style.display = 'flex';
        nav.style.flexDirection = 'column';
        nav.style.position = 'absolute';
        nav.style.top = '100%';
        nav.style.left = '0';
        nav.style.right = '0';
        nav.style.background = 'rgba(13, 15, 26, 0.98)';
        nav.style.padding = '24px 5%';
        nav.style.borderBottom = '1px solid rgba(255, 255, 255, 0.07)';
        nav.style.gap = '20px';
      }
    });
  </script>

</body>
</html>
