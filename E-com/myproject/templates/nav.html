{% load static %}
    <!-- ===== HEADER ===== -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="{% url 'home' %}" class="logo">NO<span>IR</span></a>
      <nav class="nav" id="nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="#">New Drops</a>
        <a href="{% url 'register' %}">Signup</a>
        <a href="{% url 'login_' %}">Signin</a>
        <a href="#">Profile</a>
        <a href="#">Logout</a>
      </nav>
      <div class="header-actions">
        <!-- From Uiverse.io by xbeat_5120 --> 
        <div class="uiverse-pixel-input-wrapper">
          <input
            placeholder="Enter name..."
            class="uiverse-pixel-input"
            id="username"
            type="text"
          />
        </div>
        <button class="icon-btn" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
          <span class="cart-count">3</span>
        </button>
        <button class="icon-btn" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button class="icon-btn" aria-label="Logout">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
        <div class="hamburger" id="hamburger" aria-label="Menu">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </header>
