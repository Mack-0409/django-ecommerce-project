{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'CSS/nav.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/footer.css' %}">
    <style>
      :root {
        --bg:         #0D0F1A;
        --card:       #161928;
        --text:       #F5F0E8;
        --muted:      rgba(245, 240, 232, 0.55);
        --accent:     #FF4D4D;
        --border:     rgba(255, 255, 255, 0.07);
        --ff-display: 'Bebas Neue', sans-serif;
        --ff-body:    'DM Sans', sans-serif;
        --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);
        --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: var(--bg); color: var(--text); font-family: var(--ff-body); }
      a { text-decoration: none; color: inherit; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'nav.html' %}

    {% block content %}
    {% endblock %}
    
    {% include 'footer.html' %}
    {% block extra_js %}{% endblock %}
</body>
</html>
