{% extends 'main.html' %}

{% block newsletter %}
{% load static %}
    <!-- ===== NEWSLETTER ===== -->
     <link rel="stylesheet" href="{% static 'CSS/newsletter.css' %}">
  <div class="newsletter reveal">
    <p class="section-eyebrow">Stay in the Loop</p>
    <h2 class="section-label">Join the Noir Crew</h2>
    <p class="section-sub">Be first to know about exclusive drops, early access, and members-only pricing.</p>
    <form class="email-form" onsubmit="event.preventDefault();showToast('✉️','You\'re signed up!');this.reset()">
      <input class="email-input" type="email" placeholder="Enter your email" required>
      <button class="btn-primary" type="submit">Subscribe</button>
    </form>
  </div>
{% endblock %}
