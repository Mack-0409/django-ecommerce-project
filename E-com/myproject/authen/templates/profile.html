{% extends 'main.html' %}

{% block extra_css %}
{% load static %}
  <link rel="stylesheet" href="{% static 'CSS/profile.css' %}">
{% endblock %}

{% block content %}

  <!-- ===== PROFILE PAGE ===== -->
  <section class="profile-page">

    <div class="profile-head">
      <div class="profile-avatar">JD</div>
      <div class="profile-head-info">
        <h1>John Doe</h1>
        <p class="profile-email">john.doe@example.com</p>
        <p class="profile-join">Member since January 2026</p>
      </div>
    </div>

    <div class="profile-grid">
      <div class="profile-card">
        <div class="profile-card-label">First Name</div>
        <div class="profile-card-value">John</div>
      </div>
      <div class="profile-card">
        <div class="profile-card-label">Last Name</div>
        <div class="profile-card-value">Doe</div>
      </div>
      <div class="profile-card">
        <div class="profile-card-label">Username</div>
        <div class="profile-card-value">johndoe</div>
      </div>
      <div class="profile-card">
        <div class="profile-card-label">Email</div>
        <div class="profile-card-value">john.doe@example.com</div>
      </div>
    </div>

    <div style="text-align:center;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="{% url 'update' %}" class="update-btn">Update Profile</a>
      <button class="logout-btn">Logout</button>
    </div>
  </section>

{% endblock %}
