{% extends 'main.html' %}

{% block content %}
{% load static %}
    <link rel="stylesheet" href="{% static 'CSS/update.css' %}">
    <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">NO<span>IR</span></a>
        <h1 class="auth-title">Update Profile</h1>
        <p class="auth-subtitle">Edit your personal details</p>
      </div>

      <form class="auth-form" id="updateProfileForm">
        <div class="form-group" style="align-items:center">
          <div class="profile-img-wrap">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&q=80" alt="Profile" id="profilePreview">
            <label for="profileImage" class="profile-img-overlay">Change</label>
          </div>
          <input type="file" id="profileImage" accept="image/*" style="display:none">
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="John" name="first_name" value="{{data.first_name}}">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" name="last_name" value="{{data.last_name}}">
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="johndoe" name="username" value="{{data.username}}">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="john@example.com" name="email" value="{{data.email}}">
        </div>


        <button type="submit" class="auth-btn">Save Changes</button>
      </form>

      <p class="auth-footer">
        <a href="{% url 'home' %}">Back to Home</a>
      </p>
    </div>
  </main>
{% endblock %}
